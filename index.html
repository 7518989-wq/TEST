<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출근길 추월</title>
<style>
:root{
  --bg:#f4f6fa;--panel:#ffffff;--text:#1d2330;--muted:#5b6474;--accent:#2f6fed;--plus:#1f9d55;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c;--panel:#1c212c;--text:#eef1f7;--muted:#9aa3b5;--accent:#5b8dff;--plus:#5fd38d;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c;--panel:#1c212c;--text:#eef1f7;--muted:#9aa3b5;--accent:#5b8dff;--plus:#5fd38d;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;
}
.app{width:100%;max-width:360px;padding:24px 16px;text-align:center}
.screen{display:none}
.screen.active{display:block}
h1{font-size:30px;margin:8px 0 10px}
h2{font-size:20px;margin:0 0 10px}
.rule{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 24px}
.btn{
  font:inherit;font-weight:700;font-size:18px;border:none;border-radius:12px;padding:14px 20px;
  background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
.btn.primary{background:var(--accent);color:#fff;min-width:200px}
.top5{margin-top:36px}
.slot{
  background:var(--panel);border-radius:10px;padding:10px;margin:6px 0;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.hud{
  display:flex;justify-content:space-between;font-size:18px;font-weight:600;
  max-width:300px;margin:0 auto 10px;
}
.hud b{font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.stage{position:relative;max-width:300px;margin:0 auto}
#cv{
  display:block;margin:0 auto;border-radius:14px;
  width:auto;max-width:100%;aspect-ratio:300/440;
  height:min(440px, calc(100vh - 190px));
  height:min(440px, calc(100svh - 190px));
}
.plus{
  position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);
  font-size:40px;font-weight:800;color:var(--plus);opacity:0;pointer-events:none;
  text-shadow:0 2px 6px rgba(0,0,0,.4);
}
.plus.show{animation:pop .5s ease-out forwards}
@keyframes pop{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(1)}
}
.controls{display:flex;gap:12px;max-width:300px;margin:14px auto 0}
.ctl{flex:1;height:72px;font-size:28px;padding:0}
.result{font-size:28px;margin:16px 0}
.result b{color:var(--accent);font-size:40px}
.reason{color:var(--muted);margin:0 0 24px}
</style>
</head>
<body>
<div class="app">

  <section id="start" class="screen active">
    <h1>출근길 추월</h1>
    <p class="rule">앞차를 피해 60초 동안 최대한 많이 추월하세요. ← → 키 또는 ◀ ▶ 버튼으로 차선을 바꿔요.</p>
    <button class="btn primary" id="startBtn">시작</button>
  </section>

  <section id="play" class="screen">
    <div class="hud">
      <span>추월 <b id="count">0</b>대</span>
      <span>남은 시간 <b id="time">60</b>초</span>
    </div>
    <div class="stage">
      <canvas id="cv" width="300" height="440"></canvas>
      <div class="plus" id="plus">+1</div>
    </div>
    <div class="controls">
      <button class="btn ctl" id="left" aria-label="왼쪽 차선으로">◀</button>
      <button class="btn ctl" id="right" aria-label="오른쪽 차선으로">▶</button>
    </div>
  </section>

  <section id="over" class="screen">
    <h2 style="font-size:26px;margin:24px 0 8px">게임오버</h2>
    <p class="result">추월 <b id="final">0</b>대</p>
    <p class="reason" id="reason"></p>
    <button class="btn primary" id="retry">다시 하기</button>
  </section>

</div>

<script>
(() => {
  // 논리 좌표계 (캔버스 300 x 440)
  const W = 300, H = 440;
  const LANES = [70, 150, 230];          // 차선 중심 x
  const ROAD_L = 30, ROAD_R = 270;
  const CAR_W = 52, CAR_H = 80, INSET = 6;
  const PLAYER_Y = H - 100;              // 내 차 위쪽(앞끝) y
  const FALL_TIME = 2;                   // 화면 맨 위에서 맨 아래까지 2초
  const SPEED = (H + CAR_H) / FALL_TIME; // px/s
  const GAME_TIME = 60;

  const $ = id => document.getElementById(id);
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  const plusEl = $('plus');

  let state = 'start';                   // start | play | over
  let player = { lane: 1 };
  let enemies = [];
  let elapsed = 0, spawnAcc = 0, score = 0;
  let lastTs = 0, rafId = 0, shownSec = -1, plusTimer = 0;

  // 앞차 간격: 1.2초마다 한 대 (점점 빨라지기는 2차에서 더함)
  function spawnInterval(t) {
    return 1.2;
  }

  function spawn() {
    enemies.push({ lane: Math.floor(Math.random() * 3), y: -CAR_H, threat: false, passed: false });
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  }

  function showPlus() {
    plusEl.classList.remove('show');
    void plusEl.offsetWidth;             // 애니메이션 재시작
    plusEl.classList.add('show');
    clearTimeout(plusTimer);
    plusTimer = setTimeout(() => plusEl.classList.remove('show'), 500);
  }

  function update(dt) {
    elapsed += dt;
    if (elapsed >= GAME_TIME) {
      elapsed = GAME_TIME;
      endGame('time');
      return;
    }

    spawnAcc += dt;
    while (spawnAcc >= spawnInterval(elapsed)) {
      spawnAcc -= spawnInterval(elapsed);
      spawn();
    }

    for (const e of enemies) e.y += SPEED * dt;

    for (const e of enemies) {
      const sameLane = e.lane === player.lane;

      // 부딪힘: 같은 차선에서 겹치면 게임오버
      if (sameLane &&
          e.y + CAR_H - INSET > PLAYER_Y + INSET &&
          e.y + INSET < PLAYER_Y + CAR_H - INSET) {
        endGame('crash');
        return;
      }

      // 내 차선으로 오던 차: 내 차 앞끝 위에 있는 동안 내 차선에 있었던 차
      if (sameLane && e.y + CAR_H <= PLAYER_Y) e.threat = true;

      // 추월: 내 차선을 피해 간 차의 뒤끝(위쪽)이 내 차 앞끝 아래로 내려간 순간
      if (!e.passed && e.threat && !sameLane && e.y > PLAYER_Y) {
        e.passed = true;
        score++;
        $('count').textContent = String(score);
        showPlus();
      }
    }

    enemies = enemies.filter(e => e.y < H);

    const sec = Math.max(0, Math.ceil(GAME_TIME - elapsed));
    if (sec !== shownSec) {
      shownSec = sec;
      $('time').textContent = String(sec);
    }
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function car(cx, y, body, headsDown) {
    const x = cx - CAR_W / 2;
    ctx.fillStyle = body;
    rr(x, y, CAR_W, CAR_H, 10);
    ctx.fill();
    ctx.fillStyle = 'rgba(20,25,35,0.6)';
    const gy = headsDown ? y + CAR_H - 30 : y + 12;
    rr(x + 8, gy, CAR_W - 16, 18, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const ly = headsDown ? y + CAR_H - 6 : y + 3;
    ctx.fillRect(x + 6, ly, 8, 3);
    ctx.fillRect(x + CAR_W - 14, ly, 8, 3);
  }

  function draw() {
    ctx.fillStyle = '#1b202a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2f3542';
    ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);

    // 차선 점선 (움직이는 효과)
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([22, 18]);
    ctx.lineDashOffset = -((elapsed * 240) % 40);
    ctx.beginPath();
    ctx.moveTo(110, 0); ctx.lineTo(110, H);
    ctx.moveTo(190, 0); ctx.lineTo(190, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // 도로 가장자리
    ctx.strokeStyle = '#f5f5f5';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(ROAD_L, 0); ctx.lineTo(ROAD_L, H);
    ctx.moveTo(ROAD_R, 0); ctx.lineTo(ROAD_R, H);
    ctx.stroke();

    for (const e of enemies) car(LANES[e.lane], e.y, '#ef6a3a', true);
    car(LANES[player.lane], PLAYER_Y, '#3b82f6', false);
  }

  function frame(ts) {
    const dt = Math.max(0, Math.min((ts - lastTs) / 1000, 0.05));
    lastTs = ts;
    if (state !== 'play') return;
    update(dt);
    if (state === 'play') {
      draw();
      rafId = requestAnimationFrame(frame);
    }
  }

  function startGame() {
    cancelAnimationFrame(rafId);
    enemies = [];
    player.lane = 1;
    elapsed = 0;
    spawnAcc = 0;
    score = 0;
    shownSec = -1;
    $('count').textContent = '0';
    $('time').textContent = String(GAME_TIME);
    plusEl.classList.remove('show');
    state = 'play';
    show('play');
    draw();
    lastTs = performance.now();
    rafId = requestAnimationFrame(frame);
  }

  function endGame(reason) {
    state = 'over';
    cancelAnimationFrame(rafId);
    clearTimeout(plusTimer);
    plusEl.classList.remove('show');
    draw();
    $('final').textContent = String(score);
    $('reason').textContent = reason === 'crash' ? '앞차와 부딪혔어요' : '60초가 지났어요';
    show('over');
  }

  function move(d) {
    if (state !== 'play') return;
    const n = player.lane + d;
    if (n < 0 || n > 2) return;
    player.lane = n;
  }

  // PC: 키보드 ← →
  window.addEventListener('keydown', e => {
    if (state !== 'play') return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      if (!e.repeat) move(e.key === 'ArrowLeft' ? -1 : 1);
    }
  });

  // 휴대폰: ◀ ▶ 버튼
  function bindPress(el, fn) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      fn();
    });
  }
  bindPress($('left'), () => move(-1));
  bindPress($('right'), () => move(1));

  $('startBtn').addEventListener('click', startGame);
  $('retry').addEventListener('click', startGame);

  draw();
})();
</script>
</body>
</html>
